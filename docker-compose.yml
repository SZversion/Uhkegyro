# 필수 조건 2 — `docker compose up` 한 줄로 전체 서비스가 떠야 합니다.
# 로컬 개발도 Neon dev 브랜치 사용 (별도 DB 컨테이너 불필요)
# 실행 전: .env 파일에 Neon dev branch DATABASE_URL 필수 설정
# MCP 로컬 테스트: `docker compose --profile mcp up` (별도 포트 8001)
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    # Apple Silicon에서 이미지가 안 뜨면 아래 주석을 해제해 보세요
    # platform: linux/amd64

  mcp:
    build: .
    command: uvicorn backend.mcp.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    env_file:
      - .env
    profiles:
      - mcp
    # Apple Silicon에서 이미지가 안 뜨면 아래 주석을 해제해 보세요
    # platform: linux/amd64